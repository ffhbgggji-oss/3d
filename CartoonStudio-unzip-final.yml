name: Build CartoonStudio APK

"on":
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract CartoonStudio source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 1 -type f -iname 'CartoonStudio*.zip' -print -quit)"
          if [ -n "$ARCHIVE" ]; then
            echo "Extracting $ARCHIVE"
            unzip -oq "$ARCHIVE" -d .
            rm -f "$ARCHIVE"
          fi
          test -s project.godot
          test -s export_presets.cfg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/unzip.yml .github/workflows/CartoonStudio-unzip-final.yml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Import CartoonStudio project [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-34" \
            "build-tools;33.0.2" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

      - name: Install Godot 4.2.1
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip -O godot.zip
          unzip -oq godot.zip -d godot-bin
          sudo install -m 0755 godot-bin/Godot_v4.2.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install matching Godot export templates
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz -O templates.tpz
          mkdir -p templates-extracted "$HOME/.local/share/godot/export_templates/4.2.1.stable"
          unzip -oq templates.tpz -d templates-extracted
          cp -a templates-extracted/templates/. "$HOME/.local/share/godot/export_templates/4.2.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.2.1.stable/android_source.zip"
          test -s templates-extracted/templates/version.txt

      - name: Build Android File Picker plugin
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 -p android-plugin :GodotAndroidFilePicker:assembleRelease
          mkdir -p addons/GodotAndroidFilePicker/bin/release
          cp android-plugin/GodotAndroidFilePicker/build/outputs/aar/GodotAndroidFilePicker-release.aar \
            addons/GodotAndroidFilePicker/bin/release/GodotAndroidFilePicker.aar
          test -s addons/GodotAndroidFilePicker/bin/release/GodotAndroidFilePicker.aar

      - name: Prepare Android Gradle template and remove resource sidecars
        run: |
          set -euo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.1.stable"
          TEMPLATE_VERSION="$(tr -d '\r\n' < templates-extracted/templates/version.txt)"
          rm -rf android
          mkdir -p android/build
          printf '%s\n' "$TEMPLATE_VERSION" > android/.build_version
          : > android/build/.gdignore
          unzip -oq "$TEMPLATE_DIR/android_source.zip" -d android/build
          touch android/build/gradle.properties
          cat >> android/build/gradle.properties <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          android.useAndroidX=true
          android.enableJetifier=true
          PROPERTIES
          # Remove imported sidecar metadata that Android's resource merger rejects.
          find android/build/res -type f -name '*.import' -delete 2>/dev/null || true
          # Also remove any stale sidecars immediately before resource merge.
          cat >> android/build/build.gradle <<'GRADLE'
          
          // CartoonStudio CI: Godot .import sidecars are not Android resources.
          tasks.configureEach { task ->
              if (task.name == 'mergeDebugResources' || task.name == 'mergeReleaseResources') {
                  task.doFirst {
                      fileTree("$projectDir/res").matching { include '**/*.import' }.files.each { delete it }
                  }
              }
          }
          GRADLE
          test -s android/build/build.gradle

      - name: Generate debug signing key
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -deststoretype JKS
          test -s "$RUNNER_TEMP/debug.keystore"

      - name: Configure Godot debug signing
        env:
          DEBUG_KEYSTORE: ${{ runner.temp }}/debug.keystore
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('export_presets.cfg')
          s = p.read_text()
          marker = '[preset.0.options]'
          if marker not in s:
              raise SystemExit('Missing [preset.0.options] in export_presets.cfg')
          head, tail = s.split(marker, 1)
          values = {
              'keystore/debug': os.environ['DEBUG_KEYSTORE'],
              'keystore/debug_user': 'androiddebugkey',
              'keystore/debug_password': 'android',
          }
          for key, value in values.items():
              line = f'{key}="{value}"'
              pattern = rf'(?m)^{re.escape(key)}=.*$'
              if re.search(pattern, tail):
                  tail = re.sub(pattern, lambda _: line, tail, count=1)
              else:
                  tail = tail.rstrip() + '\n' + line + '\n'
          p.write_text(head + marker + tail)
          PY

      - name: Validate and import Godot project
        run: |
          set -euo pipefail
          test -s project.godot
          test -s export_presets.cfg
          test -s icon.png
          test -s addons/GodotAndroidFilePicker/bin/release/GodotAndroidFilePicker.aar
          godot --headless --editor --path . --quit
          # Godot may recreate import sidecars during editor import.
          find android/build/res -type f -name '*.import' -delete 2>/dev/null || true

      - name: Export and verify APK
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --verbose --export-debug "Android" build/CartoonStudio-debug.apk
          test -s build/CartoonStudio-debug.apk
          unzip -t build/CartoonStudio-debug.apk >/dev/null
          echo "APK exported and ZIP integrity verified."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CartoonStudio-APK
          path: build/CartoonStudio-debug.apk
          if-no-files-found: error
          retention-days: 14
