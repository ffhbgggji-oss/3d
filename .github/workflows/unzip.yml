name: CartoonStudio Unzip and Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP="CartoonStudio-new-interface-only-fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP archive not found!"
            exit 1
          fi

          unzip -o "$ZIP" -d .
          rm "$ZIP"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          
      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;23.2.8568313"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android File Picker plugin
        run: |
          cd android-plugin

          gradle wrapper --gradle-version 8.2.1

          ./gradlew assembleRelease

          mkdir -p ../addons/GodotAndroidFilePicker/bin/release

          find . -name "*.aar" -exec cp {} ../addons/GodotAndroidFilePicker/bin/release/ \;

      - name: Build Android File Picker plugin
        run: |
          cd android-plugin
          gradle assembleRelease

          mkdir -p ../addons/GodotAndroidFilePicker/bin/release

          find . -name "*.aar" -exec cp {} ../addons/GodotAndroidFilePicker/bin/release/ \;

      - name: Download Godot 4.2.1
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip Godot_v4.2.1-stable_linux.x86_64.zip

          chmod +x Godot_v4.2.1-stable_linux.x86_64
          sudo mv Godot_v4.2.1-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable

          wget https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz

          unzip Godot_v4.2.1-stable_export_templates.tpz -d templates

          cp templates/templates/* ~/.local/share/godot/export_templates/4.2.1.stable/

      - name: Import project
        run: |
          godot --headless --editor --path . --import

      - name: Prepare signing key
        run: |
          mkdir -p build

          keytool -genkeypair \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore build/debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure export preset
        run: |
          sed -i 's|keystore/debug=""|keystore/debug="build/debug.keystore"|' export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|' export_presets.cfg

      - name: Export APK
        run: |
          godot --headless --path . --export-debug "Android" build/CartoonStudio.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CartoonStudio-APK
          path: build/CartoonStudio.apk
          if-no-files-found: error
