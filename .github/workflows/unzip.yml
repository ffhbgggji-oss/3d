name: Build CartoonStudio APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract CartoonStudio ZIP
        run: |
          set -e
          ARCHIVE="CartoonStudio-axis-camera-fixes.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: $ARCHIVE not found in repository root"
            exit 1
          fi

          unzip -oq "$ARCHIVE" -d .
          rm "$ARCHIVE"

          test -f project.godot
          test -f export_presets.cfg

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Setup Android SDK
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

      - name: Install Godot 4.2.1
        run: |
          set -e
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip -O godot.zip
          unzip -oq godot.zip -d godot-bin
          sudo install -m 755 godot-bin/Godot_v4.2.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Godot Export Templates
        run: |
          set -e
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz -O templates.tpz
          mkdir -p templates-extracted "$HOME/.local/share/godot/export_templates/4.2.1.stable"
          unzip -oq templates.tpz -d templates-extracted
          cp -a templates-extracted/templates/. "$HOME/.local/share/godot/export_templates/4.2.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.2.1.stable/android_source.zip"

      - name: Build Android File Picker
        run: |
          set -e
          gradle --no-daemon --max-workers=2 -p android-plugin :GodotAndroidFilePicker:assembleRelease

          mkdir -p addons/GodotAndroidFilePicker/bin/release

          cp android-plugin/GodotAndroidFilePicker/build/outputs/aar/GodotAndroidFilePicker-release.aar \
            addons/GodotAndroidFilePicker/bin/release/GodotAndroidFilePicker.aar

          test -s addons/GodotAndroidFilePicker/bin/release/GodotAndroidFilePicker.aar

      - name: Prepare Android Template
        run: |
          set -e
          TEMPLATE="$HOME/.local/share/godot/export_templates/4.2.1.stable"

          rm -rf android
          mkdir -p android/build

          printf '4.2.1.stable\n' > android/.build_version
          unzip -oq "$TEMPLATE/android_source.zip" -d android/build

          touch android/build/gradle.properties

          cat >> android/build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          find android/build/res -type f -name '*.import' -delete 2>/dev/null || true

      - name: Create Debug Keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -validity 9999 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Signing
        env:
          DEBUG_KEYSTORE: ${{ runner.temp }}/debug.keystore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          p = Path("export_presets.cfg")
          s = p.read_text()

          marker = "[preset.0.options]"
          if marker not in s:
              raise SystemExit("Android preset options not found")

          head, tail = s.split(marker, 1)

          values = {
              "keystore/debug": os.environ["DEBUG_KEYSTORE"],
              "keystore/debug_user": "androiddebugkey",
              "keystore/debug_password": "android",
          }

          for key, value in values.items():
              line = f'{key}="{value}"'
              pattern = rf"(?m)^{re.escape(key)}=.*$"

              if re.search(pattern, tail):
                  tail = re.sub(pattern, lambda _: line, tail, count=1)
              else:
                  tail = tail.rstrip() + "\n" + line + "\n"

          p.write_text(head + marker + tail)
          PY

      - name: Import Godot Project
        run: |
          set -e
          godot --headless --editor --path . --quit
          find android/build/res -type f -name '*.import' -delete 2>/dev/null || true

      - name: Export APK
        run: |
          set -e
          mkdir -p build

          godot --headless --path . \
            --export-debug "Android" \
            build/CartoonStudio-debug.apk

          test -s build/CartoonStudio-debug.apk
          unzip -t build/CartoonStudio-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CartoonStudio-APK
          path: build/CartoonStudio-debug.apk
          if-no-files-found: error
          retention-days: 14
